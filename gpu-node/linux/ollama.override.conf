# Настройки Ollama для MediaMonitor (Linux, Ollama поставлена официальным установщиком).
# Установка:
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp linux/ollama.override.conf /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
[Service]
# Слушать сеть, а не только этот компьютер. Порт закрыть брандмауэром — только для сервера.
Environment="OLLAMA_HOST=0.0.0.0:11434"
# Тот же контекст, что просит сервер (LLM_NUM_CTX=8192): модель не перезагружается между запросами
# воронки (/api/chat) и сервера (/v1/chat/completions, где контекст не передаётся).
Environment="OLLAMA_CONTEXT_LENGTH=8192"
# Не выгружать модель из памяти видеокарты.
Environment="OLLAMA_KEEP_ALIVE=-1"
